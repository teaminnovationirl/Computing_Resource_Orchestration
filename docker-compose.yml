# docker-compose.yml  (database only; the app runs on the host because it drives Docker)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["127.0.0.1:5432:5432", "[::1]:5432:5432"]
    # fsync, synchronous_commit and full_page_writes off: fewer disk writes for development and
    # tests (D-66). A crash can then corrupt this database; rebuild it with the reset script.
    # Never use these three settings on the demo machine.
    command: ["postgres", "-c", "log_lock_waits=on", "-c", "deadlock_timeout=1s",
              "-c", "max_connections=200",
              "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata: {}
