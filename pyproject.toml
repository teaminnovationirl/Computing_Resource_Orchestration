# Test, lint and type-check settings only. Dependencies stay in requirements.txt
# and requirements-dev.txt.

[tool.pytest.ini_options]
minversion = "8.2"
testpaths = ["tests"]
pythonpath = ["."]
# pytest -q runs everything that needs no Docker. pytest -q -m docker runs
# the sandbox tests, because a -m on the command line replaces this one.
addopts = ["--strict-markers", "-m", "not docker", "--tb=short"]
markers = [
    "docker: needs Docker Engine on Linux with cgroup v2",
    "slow: real waits over 5 s",
    "system: end-to-end tests in tests/system",
]

[tool.pyright]
# pyright (CLI and language server) reads the packages of the project's .venv.
venvPath = "."
venv = ".venv"
# Plain `pyright` checks every Python file of the repository but the hooks (D-139): the CLI always skips
# folders whose name starts with a dot, so .claude/hooks has a project of its own (pyright -p .claude/hooks).
include = ["app", "scripts", "tests"]

[tool.ruff]
# Lint only (D-107): no formatter and no style rules. The hook
# .claude/hooks/ruff_check.py runs it on every edited .py file.
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9", "B", "BLE", "S", "DTZ", "ASYNC"]
# S603 and S607 flag every subprocess call; S602 still catches shell=True.
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI parameter defaults are markers, not shared mutable values (B008).
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Header",
]
